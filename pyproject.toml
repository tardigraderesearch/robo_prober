[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-prober"
version = "0.2.0"
description = "Fail-closed robot controller discovery, opt-in servo probing, range-of-motion finding, and hardware map / URDF export."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "evilhobo1911" }]
requires-python = ">=3.11"
keywords = ["robotics", "esp32", "pca9685", "servo", "serial", "urdf", "aruco", "hardware-discovery", "range-of-motion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Tk",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
]
dependencies = [
  "pyserial>=3.5",
  "Pillow>=10.0",
]

[project.optional-dependencies]
sbc = [
  "gpiod>=2.2,<3; sys_platform == 'linux'",
  "lgpio>=0.2.2.0; sys_platform == 'linux'",
  "smbus2>=0.4.3",
]
identify = [
  "esptool>=5.0",
]
vision = [
  "opencv-contrib-python-headless>=4.8",
  "numpy>=1.26",
]
geometry = [
  "numpy>=1.26",
  "scipy>=1.11",
  "trimesh>=4.0",
  "yourdfpy>=0.0.60",
  "opencv-contrib-python-headless>=4.8",
]
all = [
  "robo-prober[identify,vision,geometry]",
]
test = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/evilhobo1911/robo_prober"
Issues = "https://github.com/evilhobo1911/robo_prober/issues"

[project.scripts]
robo-prober = "robo_prober.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robo_prober = ["data/*.json", "firmware/*.bin", "firmware/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
