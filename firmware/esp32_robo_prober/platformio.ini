[platformio]
src_dir = src
default_envs = esp32dev, esp32-s2-saola-1, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-c6-devkitc-1

[env]
; Arduino core 3.x (pioarduino), the first with ESP32-C6 support. Pinned.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; Pins come from the board catalog (src/pin_profiles.h); the PCA9685, if any,
; is found at boot on whichever pins it is wired to.
[env:esp32dev]
board = esp32dev

[env:esp32-s2-saola-1]
board = esp32-s2-saola-1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1

; Protocol-only build: acknowledges everything and drives no outputs.
[env:esp32dev-protocol-only]
board = esp32dev
build_flags = ${env.build_flags} -DRP_OUTPUTS_NONE
