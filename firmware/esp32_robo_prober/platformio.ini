[platformio]
src_dir = src
default_envs = esp32dev, esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; Classic ESP32 dev board, PCA9685 on the default I2C pins (SDA 21, SCL 22).
[env:esp32dev]
board = esp32dev

; ESP32-S3-DevKitC-1, PCA9685 on the default I2C pins (SDA 8, SCL 9).
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; Protocol-only build: acknowledges everything and drives no outputs.
[env:esp32dev-protocol-only]
board = esp32dev
build_flags = ${env.build_flags} -DRP_OUTPUTS_NONE
