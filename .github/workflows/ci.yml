name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all,test]"
      - name: CLI smoke test
        run: |
          robo-prober --help
          robo-prober doctor
          robo-prober boards --chip ESP32
          robo-prober run-demo --out demo-map.json
          robo-prober validate-map demo-map.json
          robo-prober rom --map demo-map.json --channel 0 --rom1 1700 --rom2 1300 --operator ci --emulator
      - name: Install a virtual display (Linux GUI smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests (Linux, under Xvfb so the GUI smoke test runs)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -v
      - name: Tests
        if: runner.os != 'Linux'
        run: pytest -v

  firmware:
    name: firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/esp32_robo_prober/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build esp32dev, esp32-s3-devkitc-1 and the protocol-only variant
        run: pio run -d firmware/esp32_robo_prober -e esp32dev -e esp32-s3-devkitc-1 -e esp32dev-protocol-only
      - name: Native firmware core with warnings as errors
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/esp32_robo_prober/src \
            firmware/esp32_robo_prober/src/rp_core.cpp firmware/esp32_robo_prober/test/native/sim_main.cpp -o rp_sim
          printf 'HELLO\nARM token=ci cutoff=confirmed\nMOVE channel=0 target_us=1550 seq=1 token=ci\n' | ./rp_sim

  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python robo_prober.py from a fresh clone (twice; second run must say good to go)
        shell: bash
        run: |
          python robo_prober.py doctor < /dev/null
          python robo_prober.py doctor < /dev/null 2> second.txt
          cat second.txt
          grep -q "Good to go" second.txt
          python robo_prober.py run-demo --out launcher-demo.json < /dev/null
