name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all,test]"
      - name: CLI smoke test
        run: |
          robo-prober --help
          robo-prober boards --chip ESP32
          robo-prober run-demo --out "$RUNNER_TEMP/demo-map.json"
          robo-prober validate-map "$RUNNER_TEMP/demo-map.json"
      - name: Test
        run: python -m pytest -q
